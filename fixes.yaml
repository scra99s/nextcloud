---
# Remove this to use MariaDB instead of SQLite from the Nextcloud Deployment
          env:
            - name: SQLITE_DATABASE
              value: "nextcloud"
---
# Add this to the Nextcloud Deployment to connect it to the MariaDB database
# Also update the init container env in the Nextcloud Deployment
          env:
            - name: MYSQL_HOST
              value: nextcloud-mariadb
            - name: MYSQL_DATABASE
              value: "nextcloud"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-mariadb
                  key: mariadb-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-mariadb
                  key: mariadb-password

